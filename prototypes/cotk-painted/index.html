<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Painted Glen</title>
<style>
  :root { --ink: #2a1f1a; --paper: #f3ead8; --amber: #f2a33a; --bg: #1d1a22; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; }
  #grade { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(40,20,60,.38) 100%); }
  #hud { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; justify-content: space-between; pointer-events: none; font: 700 15px/1 Georgia, serif; color: var(--paper); }
  .row { display: flex; gap: 6px; }
  .ico { width: 22px; height: 22px; border: 2px solid var(--ink); border-radius: 50%; background: #5d5866; box-shadow: 0 2px 0 rgba(0,0,0,.35); }
  .ico.spark { transform: rotate(45deg); border-radius: 3px; width: 17px; height: 17px; margin: 2px; }
  .ico.on.spark { background: var(--amber); }
  .ico.heart { background: #c0453c; }
  .ico.heart.off { background: #5d5866; }
  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--paper); font-family: Georgia, serif; background: rgba(20,16,26,.55); padding: 16px; }
  #title h1 { font-size: clamp(30px, 8vw, 56px); margin: 0 0 10px; letter-spacing: .02em; text-shadow: 0 3px 0 var(--ink), 0 0 24px rgba(242,163,58,.5); }
  #title p { margin: 4px 0; font-size: 15px; opacity: .9; max-width: 30em; }
  #title button { margin-top: 18px; font: 700 18px Georgia, serif; color: var(--ink); background: var(--amber); border: 3px solid var(--ink); border-radius: 10px; padding: 10px 26px; box-shadow: 0 4px 0 var(--ink); }
  #title button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  #stick { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 3px solid rgba(243,234,216,.5); display: none; pointer-events: none; }
  #knob { position: absolute; left: 35px; top: 35px; width: 40px; height: 40px; border-radius: 50%; background: rgba(243,234,216,.7); }
  #toast { position: fixed; left: 16px; right: 16px; bottom: max(90px, 14vh); text-align: center; pointer-events: none; color: var(--paper); font: 700 18px Georgia, serif; text-shadow: 0 2px 0 var(--ink), 0 0 12px rgba(0,0,0,.8); }
  .hide { display: none !important; }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="grade"></div>
<div id="hud" class="hide"><div class="row" id="hearts"></div><div class="row" id="sparks"></div></div>
<div id="toast" class="hide"></div>
<div id="stick"><div id="knob"></div></div>
<div id="title">
  <h1>Colors of the King</h1>
  <p id="sub">Find three amber sparks and carry them to the beacon to free the glen, then take the road south to the loch and do it again. Keep away from the Veil wraiths.</p>
  <p>Move: WASD / arrows, or drag anywhere on the screen</p>
  <button id="go">Play</button>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { W, buildObject, OBJECT_IDS, LAYOUT, PATHS, BOUNDS, VIEW_DIR } from './world.js';

const Q = new URLSearchParams(location.search);
let seed = Number(Q.get('seed') || 1) >>> 0 || 1;
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

// ---------- renderer, camera, light ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#2b2d3a');
const camera = new THREE.PerspectiveCamera(24, 1, 1, 200);
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 70 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.04;
sun.position.set(-9, 20, 6); // upper left on screen, like the painted light
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x6a6478, 1.1));
let viewDist = 40;
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h;
  // show about 13 m across the narrow side of the screen
  const span = 13 / Math.min(1, camera.aspect) * (camera.aspect > 1 ? 1.25 : 1);
  const fovRad = camera.fov * Math.PI / 180;
  viewDist = Math.max(span / camera.aspect, span) / (2 * Math.tan(fovRad / 2)) * (camera.aspect < 1 ? camera.aspect : 1 / Math.max(1, camera.aspect / 1.6));
  viewDist = Math.min(Math.max(viewDist, 26), 60);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------- shared painted-surface shader bits ----------
const shared = {
  uReveal: { value: Array.from({ length: 6 }, () => new THREE.Vector4(0, 0, 0, 0)) },
  uTime: { value: 0 },
};
const VEIL_GLSL = /* glsl */`
uniform vec4 uReveal[6];
uniform float uTime;
float h21(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x), f.y); }
// The Veil: lines stay ink, colour drains to grey paper. Revealed circles bring the colour back,
// with a warm amber edge where the colour is filling in.
vec3 veil(vec3 col, vec2 w){
  vec3 sc = pow(max(col, 0.), vec3(1./2.2));  // judge in screen colour, not linear light
  float lum = dot(sc, vec3(.299,.587,.114));
  vec3 grey = mix(vec3(lum), vec3(.70,.70,.75), .38);
  grey = lum < .2 ? sc*.6 : grey;             // keep the ink lines
  grey = pow(grey, vec3(2.2));
  float r = 0., edge = 0.;
  float wob = (vnoise(w*1.7)-.5)*1.4 + (vnoise(w*6.)-.5)*.35;
  for (int i=0;i<6;i++){
    float rad = uReveal[i].z; if (rad <= 0.) continue;
    float d = length(w - uReveal[i].xy) + wob;
    r = max(r, smoothstep(rad, rad - .9, d));
    edge = max(edge, smoothstep(.9, 0., abs(d - rad + .45)) * uReveal[i].w);
  }
  return mix(grey, col, r) + vec3(1.,.62,.18) * edge * .55;
}`;
const SHADOW_TINT = 'vec3(.56,.55,.74)'; // purple-blue shade like the reference clip

const VERT = /* glsl */`
#include <common>
#include <shadowmap_pars_vertex>
varying vec3 vLocal; varying vec3 vWorld;
void main(){
  #include <beginnormal_vertex>
  #include <defaultnormal_vertex>
  #include <begin_vertex>
  #include <project_vertex>
  #include <worldpos_vertex>
  #include <shadowmap_vertex>
  vLocal = position; vWorld = (modelMatrix * vec4(position,1.)).xyz;
}`;
const FRAG_HEAD = /* glsl */`
#include <common>
#include <packing>
#include <lights_pars_begin>
#include <shadowmap_pars_fragment>
#include <shadowmask_pars_fragment>
varying vec3 vLocal; varying vec3 vWorld;
${VEIL_GLSL}`;

function litUniforms(extra) {
  const u = THREE.UniformsUtils.merge([THREE.UniformsLib.lights, extra]);
  Object.assign(u, extra, shared); // keep the shared ones shared (merge clones)
  return u;
}

// Painting beamed from the game camera direction, in the object's own space ("movie projector").
function paintedMaterial(tex, matrix, xf, cut) {
  return new THREE.ShaderMaterial({
    lights: true,
    uniforms: litUniforms({ map: { value: tex }, uProj: { value: new THREE.Matrix4().fromArray(matrix) }, uXf: { value: new THREE.Vector4(...xf) }, uCut: { value: cut ? 1 : 0 } }),
    vertexShader: VERT,
    fragmentShader: FRAG_HEAD + /* glsl */`
uniform sampler2D map; uniform mat4 uProj; uniform vec4 uXf; uniform float uCut;
void main(){
  vec4 c = uProj * vec4(vLocal, 1.);
  vec2 uv = (c.xy * .5 + .5) * uXf.xy + uXf.zw;
  vec3 col = texture2D(map, uv).rgb;
  // cut-out objects: leftover white background is see-through, so the outline follows the painting
  if (uCut > .5 && (min(col.r, min(col.g, col.b)) > .8 || uv.x < 0. || uv.x > 1. || uv.y < 0. || uv.y > 1.)) discard;
  // background the painter left at the very edge of the shape reads as an ink outline
  if (min(col.r, min(col.g, col.b)) > .955) col = vec3(.16,.12,.1);
  col = veil(col, vWorld.xz) * mix(${SHADOW_TINT}, vec3(1.), getShadowMask());
  gl_FragColor = vec4(col, 1.);
  #include <colorspace_fragment>
}`,
  });
}

// Ground: painted procedurally in the same ink-and-flat-colour style (sharp at any zoom).
function groundMaterial() {
  const segs = PATHS.map(a => new THREE.Vector4(...a));
  const sq = W.squares.map(a => new THREE.Vector3(...a));
  return new THREE.ShaderMaterial({
    lights: true,
    uniforms: litUniforms({ uSeg: { value: segs }, uSq: { value: sq }, uGrass: { value: groundTex.grass }, uDirt: { value: groundTex.dirt }, uCob: { value: groundTex.cobbles } }),
    vertexShader: VERT,
    fragmentShader: FRAG_HEAD + /* glsl */`
uniform vec4 uSeg[${segs.length}];
uniform vec3 uSq[${sq.length}];
float sdSeg(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h); }
vec2 h22(vec2 p){ return vec2(h21(p), h21(p+17.17)); }
vec3 toSRGBin(vec3 c){ return pow(c, vec3(2.2)); }
uniform sampler2D uGrass, uDirt, uCob;
// a texture repeated every s metres, mixed with a turned copy where the noise says, to hide the repeat
vec3 tile(sampler2D t, vec2 p, float s){
  vec2 q = p / s; float m = smoothstep(.3, .7, vnoise(p * .09));
  return mix(texture2D(t, q).rgb, texture2D(t, vec2(q.y, -q.x) * 1.13 + .37).rgb, m);
}
void main(){
  vec2 p = vWorld.xz;
  vec3 col = tile(uGrass, p, 5.);                       // painted turf (already linear: sRGB texture)
  // heather patches on top
  float hz = vnoise(p*.35 + 7.);
  vec2 c2 = floor(p*3.), l2 = fract(p*3.) - .5;
  float dot2 = step(length(l2 - (h22(c2)-.5)*.5), .12) * step(.66, hz) * step(.4, h21(c2));
  col = mix(col, toSRGBin(vec3(.62,.42,.66)), dot2);
  // moor beyond the edge of the map
  float f = vnoise(p*.22);
  vec2 bc = vec2(${((BOUNDS.x0 + BOUNDS.x1) / 2).toFixed(2)}, ${((BOUNDS.z0 + BOUNDS.z1) / 2).toFixed(2)}), bh = vec2(${((BOUNDS.x1 - BOUNDS.x0) / 2).toFixed(2)}, ${((BOUNDS.z1 - BOUNDS.z0) / 2).toFixed(2)});
  float edgeD = max(abs(p.x - bc.x) - bh.x, abs(p.y - bc.y) - bh.y);
  col *= mix(1., .7 + f * .15, smoothstep(-.5, 2.5, edgeD));
  // dirt paths with an ink edge
  float d = 1e3;
  for (int i=0;i<${segs.length};i++) d = min(d, sdSeg(p, uSeg[i].xy, uSeg[i].zw));
  float w = 1.0 + (vnoise(p*1.3)-.5)*.45;
  if (d < w) col = tile(uDirt, p, 3.5);
  if (abs(d - w) < .055) col = toSRGBin(vec3(.24,.18,.14));
  // cobbled circles with an ink rim
  for (int i=0;i<${sq.length};i++) {
    float rs = length(p - uSq[i].xy);
    if (rs < uSq[i].z + .1) {
      col = texture2D(uCob, p / 3.2).rgb;
      if (rs > uSq[i].z - .05) col = toSRGBin(vec3(.24,.18,.14));
    }
  }
  // water: the burn across the map and the loch to the south, flat blues with drawn ripples
  float wob = (vnoise(p*.6)-.5)*.9;
  float dB = abs(p.y - ${W.burn.z.toFixed(1)} - wob*.5) - ${W.burn.half.toFixed(2)};
  float dL = ${W.loch_z.toFixed(1)} + wob - p.y;
  float dW = min(dB, dL);
  if (dW < 0.) {
    float rip = fract(p.y*1.1 + vnoise(p*vec2(.5,1.6))*2.2 + uTime*.12);
    vec3 wc = mix(vec3(.24,.47,.62), vec3(.33,.58,.7), step(.5, vnoise(p*.4 + uTime*.03)));
    wc = mix(wc, vec3(.78,.9,.93), step(.93, rip) * step(.35, vnoise(p*1.7)));
    wc = mix(wc, vec3(.16,.33,.48), smoothstep(-.5, 0., dW) * .5);
    col = toSRGBin(wc);
  }
  if (abs(dW) < .06) col = toSRGBin(vec3(.18,.15,.14));
  col = veil(col, p) * mix(${SHADOW_TINT}, vec3(1.), getShadowMask());
  gl_FragColor = vec4(col, 1.);
  #include <colorspace_fragment>
}`,
  });
}

// ---------- load paintings and build the village ----------
const loader = new THREE.TextureLoader();
const loadTex = url => new Promise(res => loader.load(url, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; res(t); }, undefined, () => res(null)));
const meta = await (await fetch('assets/paint/paint.json')).json();
const solids = []; // xz boxes the hero cannot walk through
const textures = {};
for (const id of OBJECT_IDS) {
  const m = meta[id] || (meta[id] = { matrix: (await (await fetch('assets/blockout/projectors.json')).json())[id].matrix });
  textures[id] = (m.file && await loadTex('assets/paint/' + m.file)) || await loadTex('assets/blockout/' + id + '.png');
}
for (const L of LAYOUT) {
  const m = meta[L.id];
  const g = buildObject(L.id);
  const mat = paintedMaterial(textures[L.id], m.matrix, m.xf || [1, 1, 0, 0], m.file && W.cutout.includes(L.id));
  g.updateMatrixWorld(true);
  g.traverse(o => {
    if (!o.isMesh) return;
    o.geometry = o.geometry.clone().applyMatrix4(o.matrix); // bake into object space
    o.position.set(0, 0, 0); o.rotation.set(0, 0, 0); o.scale.set(1, 1, 1);
    o.material = mat; o.castShadow = true; o.receiveShadow = true;
  });
  g.position.set(L.x, L.y || 0, L.z);
  scene.add(g);
  g.updateMatrixWorld(true);
  g.traverse(o => {
    if (o.isMesh && o.userData.solid) {
      const b = new THREE.Box3().setFromObject(o);
      if (b.max.y > 0.3 && b.min.y < 1.5) solids.push({ x0: b.min.x, x1: b.max.x, z0: b.min.z, z1: b.max.z, round: ['pine', 'well', 'beacon', 'haystack', 'oak'].includes(L.id) });
    }
  });
}
const groundTex = {};
for (const n of ['grass', 'dirt', 'cobbles']) {
  const t = await loadTex('assets/ground/' + n + '.png');
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.generateMipmaps = true; t.anisotropy = 8; t.needsUpdate = true;
  groundTex[n] = t;
}
const ground = new THREE.Mesh(new THREE.PlaneGeometry(130, 150).rotateX(-Math.PI / 2), groundMaterial());
ground.position.z = 16;
ground.receiveShadow = true; scene.add(ground);

// ---------- characters (real 3D, toon shaded, always in full colour) ----------
const grad = new THREE.DataTexture(new Uint8Array([90, 170, 255]), 3, 1, THREE.RedFormat);
grad.needsUpdate = true;
const gradLight = new THREE.DataTexture(new Uint8Array([150, 210, 255]), 3, 1, THREE.RedFormat); gradLight.needsUpdate = true;
const toon = c => new THREE.MeshToonMaterial({ color: c, gradientMap: grad });
const inkMat = new THREE.MeshBasicMaterial({ color: '#241a16', side: THREE.BackSide });
function tartan() {
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  x.fillStyle = '#2f5a3c'; x.fillRect(0, 0, 64, 64);
  x.fillStyle = 'rgba(30,40,80,.8)'; x.fillRect(16, 0, 14, 64); x.fillRect(0, 16, 64, 14);
  x.fillStyle = 'rgba(190,50,45,.9)'; x.fillRect(40, 0, 3, 64); x.fillRect(0, 40, 64, 3);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 1); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function addInk(mesh, s = 1.07) { const o = new THREE.Mesh(mesh.geometry, inkMat); o.scale.setScalar(s); mesh.add(o); }
// drawn just before the hero, only where something stands in front of him
const xrayMat = new THREE.MeshBasicMaterial({ color: '#e9b86a', depthFunc: THREE.GreaterDepth, depthWrite: false });
function makeHero() {
  const g = new THREE.Group(), parts = {};
  const add = (name, geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; addInk(m); g.add(m); parts[name] = m;
    const xr = new THREE.Mesh(geo, xrayMat); xr.renderOrder = 10; m.add(xr); return m; };
  add('legL', new THREE.CylinderGeometry(.09, .08, .45, 8).translate(0, -.22, 0), toon('#e0c09a'), -.12, .5, 0);
  add('legR', new THREE.CylinderGeometry(.09, .08, .45, 8).translate(0, -.22, 0), toon('#e0c09a'), .12, .5, 0);
  const kilt = toon('#ffffff'); kilt.map = tartan();
  add('kilt', new THREE.CylinderGeometry(.26, .36, .34, 12), kilt, 0, .6, 0);
  add('body', new THREE.CylinderGeometry(.24, .26, .42, 12), toon('#e8dcc0'), 0, .95, 0);
  add('sash', new THREE.BoxGeometry(.1, .5, .5), kilt, 0, 1.0, 0).rotation.x = .6;
  add('head', new THREE.SphereGeometry(.27, 16, 12), toon('#f0c7a0'), 0, 1.42, 0);
  add('hair', new THREE.SphereGeometry(.29, 16, 10, 0, Math.PI * 2, 0, 1.4), toon('#c0602a'), 0, 1.47, -.03);
  add('armL', new THREE.CylinderGeometry(.07, .06, .4, 8).translate(0, -.18, 0), toon('#e8dcc0'), -.32, 1.12, 0);
  add('armR', new THREE.CylinderGeometry(.07, .06, .4, 8).translate(0, -.18, 0), toon('#e8dcc0'), .32, 1.12, 0);
  const eyeM = new THREE.MeshBasicMaterial({ color: '#241a16' });
  for (const x of [-.09, .09]) { const e = new THREE.Mesh(new THREE.SphereGeometry(.035, 8, 6), eyeM); e.position.set(x, 1.45, .245); g.add(e); }
  const lamp = new THREE.Mesh(new THREE.OctahedronGeometry(.11), new THREE.MeshBasicMaterial({ color: '#ffcf6a' }));
  lamp.position.set(.36, .82, .05); g.add(lamp); parts.lamp = lamp;
  g.userData.parts = parts;
  return g;
}
function makeWraith() {
  const g = new THREE.Group();
  const cloak = new THREE.MeshToonMaterial({ color: '#9c9aa8', gradientMap: grad, transparent: true, opacity: .88 });
  const body = new THREE.Mesh(new THREE.ConeGeometry(.55, 1.6, 12, 1, true), cloak); body.position.y = .95; addInk(body, 1.05); g.add(body);
  const hood = new THREE.Mesh(new THREE.SphereGeometry(.36, 14, 10), cloak); hood.position.y = 1.75; addInk(hood); g.add(hood);
  const eyeM = new THREE.MeshBasicMaterial({ color: '#dff4ff' });
  for (const x of [-.12, .12]) { const e = new THREE.Mesh(new THREE.SphereGeometry(.05, 8, 6), eyeM); e.position.set(x, 1.75, .3); g.add(e); }
  body.castShadow = hood.castShadow = true;
  return g;
}
function glowSprite(color, size) {
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
  s.scale.setScalar(size); return s;
}

const hero = makeHero(); scene.add(hero);
// The real Tavin from Colors of the King, if his model is here (it is kept out of the public repo).
// Toon shaded, with an ink outline and a see-through outline when he walks behind buildings.
async function loadTavin() {
  let gltf;
  // carried as base64 text (the artifact host does not serve .glb files); kept out of the public repo
  try {
    const res = await fetch('assets/private/tavin.json'); if (!res.ok) return;
    const bin = Uint8Array.from(atob((await res.json()).glb), c => c.charCodeAt(0));
    gltf = await new GLTFLoader().parseAsync(bin.buffer, '');
  } catch (e) { return; }
  for (const k of Object.keys(hero.userData.parts)) if (k !== 'lamp') hero.userData.parts[k].visible = false;
  hero.children.filter(c => c.isMesh && c.geometry.type === 'SphereGeometry').forEach(c => c.visible = false); // stand-in eyes
  const model = gltf.scene;
  model.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(model, true);
  G.tavinBox = [box.min.y, box.max.y];
  model.scale.setScalar(1.75 / (box.max.y - box.min.y));
  const push = m => { m.onBeforeCompile = sh => { sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n transformed += normalize(objectNormal) * 0.018;'); }; return m; };
  const ink = push(new THREE.MeshBasicMaterial({ color: '#241a16', side: THREE.BackSide }));
  const extra = [];
  model.traverse(o => {
    if (!o.isSkinnedMesh) return;
    const old = o.material;
    o.material = new THREE.MeshToonMaterial({ map: old.map || null, color: old.map ? 0xffffff : old.color, gradientMap: gradLight });
    o.castShadow = true; o.frustumCulled = false; o.renderOrder = 6;
    for (const mat of [ink, xrayMat]) {
      const c = new THREE.SkinnedMesh(o.geometry, mat); c.bind(o.skeleton, o.bindMatrix); c.frustumCulled = false;
      c.renderOrder = mat === xrayMat ? 5 : 6;
      extra.push([o.parent, c]);
    }
  });
  extra.forEach(([p, c]) => p.add(c));
  hero.add(model);
  const mixer = new THREE.AnimationMixer(model), acts = {};
  for (const clip of gltf.animations) acts[clip.name] = mixer.clipAction(clip);
  for (const n of ['Hit_Knockback', 'Yes']) if (acts[n]) { acts[n].setLoop(THREE.LoopOnce); acts[n].clampWhenFinished = true; }
  hero.userData.mixer = mixer; hero.userData.acts = acts; hero.userData.cur = null;
  hero.userData.parts.lamp.position.set(.3, .95, .1);
  G.tavin = true;
}
function heroPlay(name, fade = .2) {
  const u = hero.userData; if (!u.acts || !u.acts[name] || u.cur === name) return;
  const a = u.acts[name]; a.reset().fadeIn(fade).play();
  if (u.cur && u.acts[u.cur]) u.acts[u.cur].fadeOut(fade);
  u.cur = name;
}
{ const gl = glowSprite('rgba(255,190,90,.8)', 1.1); gl.position.set(.36, .82, .05); hero.add(gl); }

// Two stages: the glen, then the Lochside to the south. Each has three sparks, wraiths and a beacon.
const sparks = [];
function placeSparks(stage) {
  const pool = W.stages[stage].sparks.slice(); const pick = [pool.splice(0, 1)[0]]; // the first spot is always used
  while (pick.length < 3) pick.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0]);
  for (const s of sparks) scene.remove(s.obj);
  sparks.length = 0;
  for (const [x, z] of pick) {
    const o = new THREE.Group();
    const gem = new THREE.Mesh(new THREE.OctahedronGeometry(.28), new THREE.MeshBasicMaterial({ color: '#ffb340' }));
    addInk(gem, 1.12); o.add(gem); o.add(glowSprite('rgba(255,170,60,.9)', 2.2));
    o.position.set(x, .9, z); scene.add(o);
    sparks.push({ obj: o, x, z, got: false });
  }
}
const wraiths = [];
function placeWraiths(stage) {
  for (const w of wraiths) if (stage === 0 || w.fade <= 0) scene.remove(w.obj);
  if (stage === 0) wraiths.length = 0;
  for (const [x, z] of W.stages[stage].wraiths) {
    const o = makeWraith(); o.position.set(x, 0, z); scene.add(o);
    wraiths.push({ obj: o, home: new THREE.Vector2(x, z), a: rnd() * 6.28, fade: 1, stage });
  }
}
// beacon fires, one per stage
const fires = W.stages.map(st => {
  const f = new THREE.Group(); f.position.set(st.beacon[0], 2.1, st.beacon[1]); f.visible = false; scene.add(f);
  f.add(glowSprite('rgba(255,160,50,1)', 4.5));
  f.userData = { t: 0, flames: [] };
  for (let i = 0; i < 7; i++) { const fl = new THREE.Mesh(new THREE.ConeGeometry(.22, .9, 6), new THREE.MeshBasicMaterial({ color: i % 2 ? '#ffcf5a' : '#ff8a2a' })); f.add(fl); f.userData.flames.push(fl); }
  return f;
});
// the Veil bars the road south until the glen is freed
const gate = new THREE.Group(); scene.add(gate);
for (let x = -13; x <= 13; x += 2) for (const y of [1, 2.6]) { const sp = glowSprite('rgba(205,205,222,.55)', 4.2); sp.material.blending = THREE.NormalBlending; sp.position.set(x, y, W.gate_z + .4); gate.add(sp); }
// ---------- input ----------
const keys = new Set();
addEventListener('keydown', e => { keys.add(e.code); if (e.code === 'Enter' || e.code === 'Space') onAction(); });
addEventListener('keyup', e => keys.delete(e.code));
const stick = { on: false, ox: 0, oy: 0, x: 0, y: 0, id: null };
const stickEl = document.getElementById('stick'), knob = document.getElementById('knob');
renderer.domElement.addEventListener('pointerdown', e => {
  if (G.state !== 'play') return;
  Object.assign(stick, { on: true, ox: e.clientX, oy: e.clientY, x: 0, y: 0, id: e.pointerId });
  stickEl.style.display = 'block'; stickEl.style.left = e.clientX + 'px'; stickEl.style.top = e.clientY + 'px';
});
addEventListener('pointermove', e => {
  if (!stick.on || e.pointerId !== stick.id) return;
  let dx = e.clientX - stick.ox, dy = e.clientY - stick.oy; const l = Math.hypot(dx, dy), m = 45;
  if (l > m) { dx *= m / l; dy *= m / l; }
  stick.x = dx / m; stick.y = dy / m; knob.style.transform = `translate(${dx}px,${dy}px)`;
});
const endStick = e => { if (e.pointerId !== stick.id) return; stick.on = false; stick.x = stick.y = 0; stickEl.style.display = 'none'; knob.style.transform = ''; };
addEventListener('pointerup', endStick); addEventListener('pointercancel', endStick);

// screen directions on the ground (camera never turns, so these are fixed)
const SCR_R = new THREE.Vector3(1, 0, -1).normalize(), SCR_U = new THREE.Vector3(-1, 0, -1).normalize();

// ---------- game state ----------
const G = window.__game = { state: 'title', stage: 0, hearts: 3, carried: 0, t: 0, reveal: 0, hits: 0, auto: false, autoInput: null, frames: 0, x: 0, z: 0 };
const titleEl = document.getElementById('title'), hudEl = document.getElementById('hud');
const heartsEl = document.getElementById('hearts'), sparksEl = document.getElementById('sparks');
function hud() {
  heartsEl.innerHTML = [0, 1, 2].map(i => `<div class="ico heart ${i < G.hearts ? '' : 'off'}"></div>`).join('');
  sparksEl.innerHTML = [0, 1, 2].map(i => `<div class="ico spark ${i < G.carried ? 'on' : ''}"></div>`).join('');
}
const vel = new THREE.Vector2();
let invuln = 0, winT = 0;
function start() {
  G.state = 'play'; G.hearts = 3; G.carried = 0; G.t = 0; G.reveal = 0; G.hits = 0; winT = 0; invuln = 0;
  G.stage = 0;
  hero.position.set(...[W.stages[0].spawn[0], 0, W.stages[0].spawn[1]]); vel.set(0, 0);
  shared.uReveal.value.forEach(v => v.set(0, 0, 0, 0));
  fires.forEach(f => { f.visible = false; f.userData.t = 0; }); gate.visible = true; gate.children.forEach(c => c.material.opacity = 1);
  placeSparks(0); placeWraiths(0);
  titleEl.classList.add('hide'); hudEl.classList.remove('hide'); hud();
}
function end(won) {
  G.state = won ? 'won' : 'lost';
  setTimeout(() => {
    titleEl.querySelector('h1').textContent = won ? 'Glen and loch have their colour back' : 'The Veil took you';
    document.getElementById('sub').textContent = won ? 'Every street you walked is painted again.' : 'Try again. The wraiths drift, they do not run.';
    titleEl.querySelector('button').textContent = 'Play again';
    titleEl.classList.remove('hide');
  }, won ? 6500 : 900);
}
function onAction() { if (G.state !== 'play' && !titleEl.classList.contains('hide')) start(); }
document.getElementById('go').addEventListener('click', start);

function toast(text) {
  const el = document.getElementById('toast'); el.textContent = text; el.classList.remove('hide');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add('hide'), 4500);
}
function blocked(x, z, r) {
  if (x < BOUNDS.x0 || x > BOUNDS.x1 || z < BOUNDS.z0) return true;
  if (z > W.gate_z && !fires[0].visible) return true;                                  // the Veil wall
  if (Math.abs(z - W.burn.z) < W.burn.half + .1 && Math.abs(x) > W.burn.bridge_half - r) return true; // the burn; cross at the bridge
  if (z > W.loch_z - .1 && !(Math.abs(x) < W.jetty.half - r * .5 && z < W.jetty.z1)) return true;     // the loch; the jetty runs out into it
  for (const b of solids) {
    if (b.round) { const cx = (b.x0 + b.x1) / 2, cz = (b.z0 + b.z1) / 2, rr = (b.x1 - b.x0) / 2 + r; if ((x - cx) ** 2 + (z - cz) ** 2 < rr * rr) return true; }
    else if (x > b.x0 - r && x < b.x1 + r && z > b.z0 - r && z < b.z1 + r) return true;
  }
  return false;
}
G.blocked = blocked; G.hero = hero; G.sparks = sparks; G.wraiths = wraiths; G.W = W;

// ---------- loop ----------
const clock = new THREE.Clock();
const camTarget = new THREE.Vector3(0, 0, 4);
function tick() {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  shared.uTime.value += dt;
  const T = shared.uTime.value;
  if (G.state === 'play' || G.state === 'won') G.t += dt;
  // move hero
  let ix = 0, iy = 0;
  if (G.state === 'play') {
    if (keys.has('KeyA') || keys.has('ArrowLeft')) ix -= 1;
    if (keys.has('KeyD') || keys.has('ArrowRight')) ix += 1;
    if (keys.has('KeyW') || keys.has('ArrowUp')) iy += 1;
    if (keys.has('KeyS') || keys.has('ArrowDown')) iy -= 1;
    if (stick.on) { ix = stick.x; iy = -stick.y; }
    if (G.autoInput) { ix = G.autoInput[0]; iy = G.autoInput[1]; }
  }
  const dir = new THREE.Vector3().addScaledVector(SCR_R, ix).addScaledVector(SCR_U, iy);
  if (dir.lengthSq() > 1) dir.normalize();
  const speed = 5.2;
  vel.lerp(new THREE.Vector2(dir.x * speed, dir.z * speed), 1 - Math.exp(-dt * 12));
  const r = .32;
  const nx = hero.position.x + vel.x * dt, nz = hero.position.z + vel.y * dt;
  if (!blocked(nx, hero.position.z, r)) hero.position.x = nx; else vel.x = 0;
  if (!blocked(hero.position.x, nz, r)) hero.position.z = nz; else vel.y = 0;
  G.x = hero.position.x; G.z = hero.position.z;
  const sp = vel.length();
  if (sp > .3) hero.rotation.y = Math.atan2(vel.x, vel.y);
  if (hero.userData.mixer) {
    const u = hero.userData;
    if (G.state === 'won') heroPlay('Yes', .3);
    else if (u.hitT > 0) u.hitT -= dt;
    else heroPlay(sp > .6 ? 'Jog_Fwd_Loop' : 'Idle_Loop');
    if (u.cur === 'Jog_Fwd_Loop') u.acts.Jog_Fwd_Loop.timeScale = Math.max(.6, sp / speed * 1.15);
    u.mixer.update(dt);
  } else {
    const P = hero.userData.parts, sw = Math.sin(T * 11) * Math.min(1, sp / speed);
    P.legL.rotation.x = sw * .7; P.legR.rotation.x = -sw * .7; P.armL.rotation.x = -sw * .6; P.armR.rotation.x = sw * .6;
    hero.position.y = Math.abs(Math.sin(T * 11)) * .06 * Math.min(1, sp / speed);
  }
  hero.visible = invuln <= 0 || Math.floor(T * 14) % 2 === 0;
  invuln -= dt;

  // sparks
  sparks.forEach((s, i) => {
    if (s.got) return;
    s.obj.position.y = .9 + Math.sin(T * 2.5 + i) * .15; s.obj.rotation.y = T * 1.6;
    if (G.state === 'play' && Math.hypot(s.x - hero.position.x, s.z - hero.position.z) < .9) {
      s.got = true; scene.remove(s.obj); G.carried++; hud();
      shared.uReveal.value[1 + i].set(s.x, s.z, .01, 1); // a little circle of colour where it was
    }
  });
  for (let i = 1; i < 4; i++) { const v = shared.uReveal.value[i]; if (v.z > 0 && v.z < 3.2) v.z = Math.min(3.2, v.z + dt * 4); else if (v.z >= 3.2) v.w = Math.max(.35, v.w - dt); }
  // beacon of this stage
  const st = W.stages[G.stage];
  if (G.state === 'play' && G.carried === 3 && !fires[G.stage].visible && Math.hypot(hero.position.x - st.beacon[0], hero.position.z - st.beacon[1]) < 2.5) {
    fires[G.stage].visible = true;
    if (G.stage === W.stages.length - 1) end(true);
    else {
      toast('The glen is free. The road south is open.');
      setTimeout(() => { if (G.state !== 'play') return; G.stage++; G.carried = 0; for (let i = 1; i < 4; i++) shared.uReveal.value[i].set(0, 0, 0, 0); placeSparks(G.stage); placeWraiths(G.stage); hud(); }, 3500);
    }
  }
  fires.forEach((f, n) => {
    if (!f.visible) return;
    const u = f.userData; u.t += dt;
    G.reveal = Math.min(W.stages[n].flood, u.t * u.t * 3.5 + u.t * 2);
    shared.uReveal.value[n === 0 ? 0 : 4].set(W.stages[n].beacon[0], W.stages[n].beacon[1], G.reveal, 1);
    u.flames.forEach((fl, i) => { const a = i / u.flames.length * 6.28 + T; fl.position.set(Math.cos(a) * .28, Math.sin(T * 9 + i) * .1, Math.sin(a) * .28); fl.scale.y = 1 + Math.sin(T * 13 + i * 2) * .3; });
  });
  if (fires[0].visible && gate.visible) { let o = 0; gate.children.forEach(c => { c.material.opacity = Math.max(0, c.material.opacity - dt * .6); o += c.material.opacity; }); if (o <= 0) gate.visible = false; }
  gate.children.forEach((c, i) => c.position.y = (i % 2 ? 2.6 : 1) + Math.sin(T * .8 + i) * .25);
  // wraiths
  for (const w of wraiths) {
    const o = w.obj;
    if (fires[w.stage].visible) { w.fade = Math.max(0, w.fade - dt * .7); o.scale.setScalar(w.fade + .001); o.position.y += dt * 1.5; continue; }
    const dx = hero.position.x - o.position.x, dz = hero.position.z - o.position.z, d = Math.hypot(dx, dz);
    let tx, tz, spd;
    if (G.state === 'play' && d < 5.5 && G.t > 2) { tx = dx / d; tz = dz / d; spd = 2.6; }
    else { w.a += dt * .5; const gx = w.home.x + Math.cos(w.a) * 3 - o.position.x, gz = w.home.y + Math.sin(w.a * 1.3) * 3 - o.position.z, gl = Math.hypot(gx, gz) || 1; tx = gx / gl; tz = gz / gl; spd = 1.4; }
    o.position.x += tx * spd * dt; o.position.z += tz * spd * dt;
    o.position.y = .15 + Math.sin(T * 2 + w.home.x) * .12;
    o.rotation.y = Math.atan2(tx, tz);
    if (G.state === 'play' && d < .85 && invuln <= 0) {
      G.hearts--; G.hits++; invuln = 1.4; hud(); if (hero.userData.mixer) { hero.userData.cur = null; heroPlay('Hit_Knockback', .08); hero.userData.hitT = .6; }
      vel.set(dx / d * 9, dz / d * 9);
      if (G.hearts <= 0) end(false);
    }
  }
  // camera: follows the hero, never turns
  camTarget.lerp(new THREE.Vector3(hero.position.x, 0, hero.position.z), 1 - Math.exp(-dt * 4));
  camera.position.copy(camTarget).addScaledVector(VIEW_DIR, viewDist);
  camera.lookAt(camTarget.x, .8, camTarget.z);
  sun.target.position.copy(camTarget); sun.position.copy(camTarget).add(new THREE.Vector3(-9, 20, 6));
  renderer.render(scene, camera);
  G.frames++;
  requestAnimationFrame(tick);
}
await loadTavin();
G.ready = true;
if (Q.has('autostart')) start();
tick();
</script>
