<!doctype html><html><body style="margin:0">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(600, 600); document.body.appendChild(r.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color('#ccc'); sc.add(new THREE.HemisphereLight(0xffffff, 0x666666, 2));
const g = await new GLTFLoader().loadAsync('../assets/private/tavin.glb');
sc.add(g.scene);
g.scene.updateMatrixWorld(true);
const b = new THREE.Box3().setFromObject(g.scene);
const info = { min: b.min.toArray(), max: b.max.toArray(), scale: g.scene.scale.toArray(), kids: g.scene.children.map(c => [c.name, c.scale.toArray()]) };
const mixer = new THREE.AnimationMixer(g.scene); const a = g.animations.find(c => c.name === 'Jog_Fwd_Loop'); mixer.clipAction(a).play(); mixer.update(0.3);
const cam = new THREE.PerspectiveCamera(30, 1, .1, 100); cam.position.set(3, 1.5, 4); cam.lookAt(0, .9, 0);
r.render(sc, cam); window.info = info; window.done = true;
</script></body></html>
